# Experimental native protobuf module; separate from the one.google.com/ai text module.
# Default inspect mode does not change response bytes. No live purchase validation.
name: 'Google One 原生 20TB SKU 检查与改写（实验版）'
description: '诊断3：候选编号去重，标明截断情况；点击通知可复制报告。默认 inspect；完整 SKU 精确匹配后可切换 rewrite。未验证旧商品可售性、价格或权益。'
author: 'Codex'
homepage: 'https://github.com/kawhaiyoung/rule'
manual: 'https://github.com/kawhaiyoung/rule/blob/main/GoogleOne_Egern_README.md'
icon: 'arrow.triangle.2.circlepath'

env_schema:
  MODE:
    name: '运行模式'
    description: 'inspect 只检查；rewrite 替换截图中的完整 20TB SKU 并重算 protobuf 长度。'
    default_value: 'inspect'
    options:
      - 'inspect'
      - 'rewrite'
  FIELD_PATHS:
    name: '字段编号路径（可选）'
    description: '按检查结果限制候选字段，如 1.2.3；多个路径用英文逗号分隔。留空允许所有完整值匹配。没有 .proto，路径含义仍需核对。'
  NOTIFY:
    name: '状态通知'
    description: '状态或候选商品编号变化时显示通知；仅展示计数、候选编号和字段路径。'
    default_value: 'true'
    options:
      - 'true'
      - 'false'

mitm:
  hostnames:
    - 'subscriptionsmobile-pa.googleapis.com'

http_captures:
  - 'subscriptionsmobile-pa.googleapis.com'

scriptings:
  - http_request:
      name: 'Google One 原生接口 identity 编码'
      match: '^https://subscriptionsmobile-pa\.googleapis\.com(?::443)?/(?:[^?#]*/)?GetDynamicStorefrontInfo(?:\?[^#]*)?$'
      script_url: 'https://raw.githubusercontent.com/kawhaiyoung/rule/main/GoogleOne_Native_20TB_Egern.js?v=3'
      update_interval: 300
      body_required: false
      timeout: 10
  - http_response:
      name: 'Google One 原生 20TB protobuf'
      match: '^https://subscriptionsmobile-pa\.googleapis\.com(?::443)?/(?:[^?#]*/)?GetDynamicStorefrontInfo(?:\?[^#]*)?$'
      script_url: 'https://raw.githubusercontent.com/kawhaiyoung/rule/main/GoogleOne_Native_20TB_Egern.js?v=3'
      update_interval: 300
      body_required: true
      binary_body: true
      max_size: 2097152
      timeout: 10
