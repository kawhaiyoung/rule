# Revision 3: built-in WEB mappings are independent of optional diagnostic scripts.
# Intended entry: the Google search app (multicolour G), Settings > Google One.
# Apple-billed existing subscriptions may redirect to their original purchase app.
# No fixed price or eligibility is encoded; Apple quotes and Google entitlements need live checks.
name: 'Google App Ultra 网页 SKU 改写（诊断3）'
description: '恢复内置20TB、30TB网页SKU规则；脚本只检查并写入日志，诊断失败不影响内置规则。尚未验证已有会员低价升级、Apple报价或Ultra权益。'
author: 'Codex'
homepage: 'https://www.nodeseek.com/post-1070216-1'
manual: 'https://github.com/kawhaiyoung/rule/blob/main/GoogleOne_Egern_README.md'
icon: 'arrow.triangle.2.circlepath'

env_schema:
  NOTIFY:
    name: '诊断通知'
    description: '显示检查状态，点击通知可复制报告；未显示通知时可查看设置中的脚本日志。'
    default_value: 'true'
    options:
      - 'true'
      - 'false'

# Reuse the current trusted Egern CA; no CA or proxy settings are embedded.
mitm:
  hostnames:
    - 'one.google.com'
    - 'subscriptionsmobile-pa.googleapis.com'

# Egern HTTP captures are separate from the bounded script diagnostics.
# Captures may contain account data; the script report does not include full payloads or headers.
http_captures:
  - 'one.google.com'
  - 'subscriptionsmobile-pa.googleapis.com'

# Preserve the original tutorial mappings without depending on JavaScript execution.
body_rewrites:
  - response_regex:
      match: '^https://one\.google\.com(?::443)?/ai/?(?:\?[^#]*)?$'
      find: '20tb\.m\.v2'
      replace: '20tb.m'
      disabled: false
  - response_regex:
      match: '^https://one\.google\.com(?::443)?/ai/?(?:\?[^#]*)?$'
      find: '30tb\.ai\.pro\.m'
      replace: '30tb.m'
      disabled: false

scriptings:
  - http_request:
      name: 'Google App Ultra 诊断3 · 新请求'
      match: '^https://(?:one\.google\.com(?::443)?/ai/?(?:\?[^#]*)?|subscriptionsmobile-pa\.googleapis\.com(?::443)?/(?:[^?#]*/)?GetDynamicStorefrontInfo(?:\?[^#]*)?)$'
      script_url: 'https://raw.githubusercontent.com/kawhaiyoung/rule/main/GoogleApp_Ultra_Web_Egern.js?v=3'
      update_interval: 300
      body_required: false
      timeout: 10
  - http_response:
      name: 'Google App Ultra 诊断3 · 网页'
      match: '^https://one\.google\.com(?::443)?/ai/?(?:\?[^#]*)?$'
      script_url: 'https://raw.githubusercontent.com/kawhaiyoung/rule/main/GoogleApp_Ultra_Web_Egern.js?v=3'
      update_interval: 300
      body_required: true
      binary_body: true
      max_size: 2097152
      timeout: 10
  - http_response:
      name: 'Google App Ultra 诊断3 · 原生只检查'
      match: '^https://subscriptionsmobile-pa\.googleapis\.com(?::443)?/(?:[^?#]*/)?GetDynamicStorefrontInfo(?:\?[^#]*)?$'
      script_url: 'https://raw.githubusercontent.com/kawhaiyoung/rule/main/GoogleApp_Ultra_Web_Egern.js?v=3'
      update_interval: 300
      body_required: true
      binary_body: true
      max_size: 2097152
      timeout: 10
  - generic:
      name: 'Google App Ultra 诊断3 · 最近报告'
      script_url: 'https://raw.githubusercontent.com/kawhaiyoung/rule/main/GoogleApp_Ultra_Web_Egern.js?v=3'
      update_interval: 300
      timeout: 10

