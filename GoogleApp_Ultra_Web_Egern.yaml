# Revision 2: preserve the tutorial's Turkish-storefront WEB fragment mappings.
# Intended entry: the Google search app (multicolour G), Settings > Google One.
# Apple-billed existing subscriptions may redirect to their original purchase app.
# No fixed price or eligibility is encoded; Apple quotes and Google entitlements need live checks.
name: 'Google App Ultra 网页 SKU 改写（诊断2）'
description: '网页保留20TB、30TB旧SKU映射并显示命中状态；新增原生套餐接口检查，不改写原生响应。Google页面价签可能不变，尚未验证已有会员升级、Apple报价或Ultra权益。'
author: 'Codex'
homepage: 'https://www.nodeseek.com/post-1070216-1'
manual: 'https://github.com/kawhaiyoung/rule/blob/main/GoogleOne_Egern_README.md'
icon: 'arrow.triangle.2.circlepath'

env_schema:
  MODE:
    name: '网页处理模式'
    description: 'rewrite沿用教程两条网页映射；inspect只检查。原生接口始终只检查。'
    default_value: 'rewrite'
    options:
      - 'rewrite'
      - 'inspect'
  NOTIFY:
    name: '诊断通知'
    description: '显示命中及替换计数，点击通知可复制最近报告；不自动上传报告。'
    default_value: 'true'
    options:
      - 'true'
      - 'false'

# Reuse the current trusted Egern CA; no CA or proxy settings are embedded.
mitm:
  hostnames:
    - 'one.google.com'
    - 'subscriptionsmobile-pa.googleapis.com'

# Egern HTTP captures are separate from the bounded script diagnostics.
# Captures may contain account data; the script report does not include full payloads or headers.
http_captures:
  - 'one.google.com'
  - 'subscriptionsmobile-pa.googleapis.com'

scriptings:
  - http_request:
      name: 'Google App Ultra 诊断2 · 新请求'
      match: '^https://(?:one\.google\.com(?::443)?/ai/?(?:\?[^#]*)?|subscriptionsmobile-pa\.googleapis\.com(?::443)?/(?:[^?#]*/)?GetDynamicStorefrontInfo(?:\?[^#]*)?)$'
      script_url: 'https://raw.githubusercontent.com/kawhaiyoung/rule/main/GoogleApp_Ultra_Web_Egern.js?v=2'
      update_interval: 300
      body_required: false
      timeout: 10
  - http_response:
      name: 'Google App Ultra 诊断2 · 网页'
      match: '^https://one\.google\.com(?::443)?/ai/?(?:\?[^#]*)?$'
      script_url: 'https://raw.githubusercontent.com/kawhaiyoung/rule/main/GoogleApp_Ultra_Web_Egern.js?v=2'
      update_interval: 300
      body_required: true
      binary_body: true
      max_size: 2097152
      timeout: 10
  - http_response:
      name: 'Google App Ultra 诊断2 · 原生只检查'
      match: '^https://subscriptionsmobile-pa\.googleapis\.com(?::443)?/(?:[^?#]*/)?GetDynamicStorefrontInfo(?:\?[^#]*)?$'
      script_url: 'https://raw.githubusercontent.com/kawhaiyoung/rule/main/GoogleApp_Ultra_Web_Egern.js?v=2'
      update_interval: 300
      body_required: true
      binary_body: true
      max_size: 2097152
      timeout: 10
  - generic:
      name: 'Google App Ultra 诊断2 · 最近报告'
      script_url: 'https://raw.githubusercontent.com/kawhaiyoung/rule/main/GoogleApp_Ultra_Web_Egern.js?v=2'
      update_interval: 300
      timeout: 10

